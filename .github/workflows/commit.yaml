name: Commit

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show Prettier diff
        run: |
          npx prettier --write src/extension-ui-controller.ts src/utils/auto-switch-policy.ts test/utils/auto-switch-policy.test.ts
          git diff -- src/extension-ui-controller.ts src/utils/auto-switch-policy.ts test/utils/auto-switch-policy.test.ts
          exit 1

      - name: Run check
        run: npm run check
