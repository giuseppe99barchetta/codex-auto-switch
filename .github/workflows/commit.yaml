name: Commit

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/smarter-auto-switch

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format feature changes
        run: |
          npx prettier --write package.json package.nls.json src/auth/profile-state-service.ts src/extension-ui-controller.ts src/utils/auto-switch-policy.ts src/utils/auto-switch-state.ts test/auth/profile-state-service.test.ts test/utils/auto-switch-policy.test.ts test/utils/auto-switch-state.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package.nls.json src/auth/profile-state-service.ts src/extension-ui-controller.ts src/utils/auto-switch-policy.ts src/utils/auto-switch-state.ts test/auth/profile-state-service.test.ts test/utils/auto-switch-policy.test.ts test/utils/auto-switch-state.test.ts
            git commit -m "style: format smart auto-switch changes"
            git push origin HEAD:feat/smarter-auto-switch
          fi

      - name: Run check
        run: npm run check
